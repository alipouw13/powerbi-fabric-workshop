# parameter.yml  -  fabric-cicd parameterization for the Contoso Insurance workshop
# ---------------------------------------------------------------------------
# fabric-cicd (https://microsoft.github.io/fabric-cicd/) is the Microsoft-backed
# open-source Python library that deploys PBIP / Fabric items from Git to a
# workspace. This file remaps environment-specific values (connection ids,
# lakehouse ids, workspace ids) as items move dev -> test -> prod, so the same
# committed artifact deploys cleanly to each stage.
#
# Used in Lab 9. Replace the GUIDs with your own (kept out of source where
# sensitive - see the note at the bottom).

find_replace:
  # Lakehouse id referenced by notebooks / semantic models
  - find_value: "00000000-0000-0000-0000-DEV-LAKEHOUSE"
    replace_value:
      schwab-dev:  "<dev-lakehouse-guid>"
      schwab-test: "<test-lakehouse-guid>"
      schwab-prod: "<prod-lakehouse-guid>"

  # SQL connection string / endpoint used by the semantic model (Direct Lake)
  - find_value: "DEV-SQL-ENDPOINT"
    replace_value:
      schwab-dev:  "<dev-endpoint>"
      schwab-test: "<test-endpoint>"
      schwab-prod: "<prod-endpoint>"

# Optional: control which item types deploy
# (SemanticModel and Report are the PBIP outputs; add Notebook / DataPipeline as needed)
item_types_in_scope:
  - SemanticModel
  - Report

# ---------------------------------------------------------------------------
# SECURITY: do not commit real workspace GUIDs / secrets if your repo is shared.
# Pass them as environment variables / pipeline variables and reference them, or
# keep this file in a private deployment repo. See lab-09 for the pattern.
